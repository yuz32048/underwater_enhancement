paths:
  input_dir: data/raw_underwater
  clean_dir: data/clean_images
  degraded_dir: outputs/degraded_images
  analysis_dir: outputs/analysis
  classified_dir: outputs/classified_images
  enhanced_dir: outputs/enhanced
  checkpoint_dir: outputs/checkpoints
  sample_dir: outputs/samples
  log_dir: outputs/logs

analysis:
  low_light_pixel_threshold: 50
  histogram_bins: 256
  canny_threshold1: 80
  canny_threshold2: 180

archive_extraction:
  enabled: true
  extract_dir_name: _extracted_archives
  overwrite: false
  passwords: ["", "1234567", "8901234", "5678901"]

classification:
  blue_mean_threshold: 115
  blue_red_diff_threshold: 18
  green_mean_threshold: 105
  green_red_diff_threshold: 15
  brightness_threshold: 75
  low_light_ratio_threshold: 0.35
  laplacian_var_threshold: 80
  blurry_edge_density_threshold: 0.025

degradation:
  types: [blue_shift, green_shift, low_light, blur]
  num_per_image: 2
  image_size: 256
  beta_range: [0.35, 1.8]
  depth_range: [0.2, 1.0]
  background_light_range: [0.55, 1.0]
  blur_kernel_choices: [3, 5, 7]

training:
  image_size: 256
  batch_size: 2
  epochs: 100
  lr: 0.0002
  beta1: 0.5
  num_workers: 2
  lambda_adv: 1.0
  lambda_cycle: 10.0
  lambda_identity: 5.0
  lambda_ssim: 1.0
  save_sample_every: 200
  checkpoint_every_epoch: 1
  resume: ""
  device: auto

testing:
  checkpoint: ""
  input_dir: data/test_underwater
  target_dir: data/test_clean
  output_dir: outputs/test_enhanced
  image_size: 256

seed: 42
